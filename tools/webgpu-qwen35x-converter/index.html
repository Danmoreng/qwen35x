<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>qwen35x WebGPU Converter</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101214;
        color: #eef1f3;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
      }

      main {
        width: min(980px, calc(100vw - 32px));
        padding: 28px 0 40px;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 24px;
        font-weight: 650;
      }

      .panel {
        border: 1px solid #30363d;
        border-radius: 8px;
        background: #171a1f;
        padding: 18px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 13px;
        color: #bac2ca;
      }

      input,
      select,
      button {
        font: inherit;
      }

      input[type="file"],
      select {
        min-height: 38px;
        border: 1px solid #38404a;
        border-radius: 6px;
        background: #0f1216;
        color: #eef1f3;
        padding: 8px 10px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      button {
        border: 1px solid #46505c;
        border-radius: 6px;
        background: #e8edf3;
        color: #101214;
        min-height: 38px;
        padding: 8px 13px;
        cursor: pointer;
      }

      button.secondary {
        background: #242a31;
        color: #eef1f3;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      progress {
        width: 100%;
        height: 14px;
        margin-top: 16px;
      }

      pre {
        margin: 16px 0 0;
        min-height: 260px;
        max-height: 54vh;
        overflow: auto;
        border: 1px solid #30363d;
        border-radius: 8px;
        background: #0b0d10;
        color: #d9e1e8;
        padding: 14px;
        line-height: 1.45;
        white-space: pre-wrap;
      }

      .hint {
        margin-top: 12px;
        color: #8e98a3;
        font-size: 13px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>qwen35x WebGPU Converter</h1>
      <section class="panel">
        <div class="grid">
          <label>
            HF model folder
            <input id="files" type="file" webkitdirectory multiple />
          </label>
          <label>
            Matrix storage
            <select id="storage">
              <option value="q8">q8 rowwise</option>
              <option value="f16">f16</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button id="chooseOut" type="button" class="secondary">Choose Output Folder</button>
          <button id="convert" type="button">Convert</button>
        </div>
        <progress id="progress" max="1" value="0"></progress>
        <p class="hint">
          Select the Hugging Face model directory containing config.json, safetensors, vocab.json, merges.txt,
          tokenizer.json, and tokenizer_config.json. In Chrome, choose an output directory and the converter will write
          manifest.json, weights.bin, and tokenizer files directly.
        </p>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./src/browser-converter.js"></script>
  </body>
</html>
